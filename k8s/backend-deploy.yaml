apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: qa-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: backend
        image: myregistry.com/qa-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: qa-config
        - secretRef:
            name: db-secret
        volumeMounts:
        - name: model-vol
          mountPath: /app/models
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: model-vol
        persistentVolumeClaim:
          claimName: qa-model-pvc
